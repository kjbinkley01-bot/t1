name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract (for the Read Text test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libegl1 libxkbcommon0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless mss PySide6 pytest pyflakes
      - name: Lint
        run: python -m pyflakes clicker tests tools clicker_app.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
