name: Release

# Push a tag like v2.11.0 (matching APP_VERSION in clicker/model.py) to build the Windows installer and the
# macOS disk image and publish them as a GitHub release. Installed copies of Clicker check the newest release
# once a day and offer to install it. Run it by hand (Actions > Release > Run workflow) to build everything
# as downloadable workflow artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the version
        id: version
        shell: bash
        run: |
          v=$(python -c "from clicker.model import APP_VERSION; print(APP_VERSION)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but APP_VERSION is $v"; exit 1
          fi
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean Clicker.spec

      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\clicker.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Clicker -DestinationPath Clicker-windows-portable.zip
          Move-Item dist\Clicker-Setup.exe Clicker-Setup.exe
      - name: Build the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && cp -R dist/Clicker.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Clicker -srcfolder dmg -ov -format UDZO Clicker-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: clicker-${{ runner.os }}
          path: |
            Clicker-Setup.exe
            Clicker-windows-portable.zip
            Clicker-macos.dmg
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Clicker-Setup.exe
            Clicker-windows-portable.zip
            Clicker-macos.dmg
          generate_release_notes: true
