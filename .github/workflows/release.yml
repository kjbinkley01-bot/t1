name: Release

# Push a tag like v2.1.0 to build the Windows and macOS apps and publish a
# GitHub release. Clicker's update check looks at the newest release here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Clicker-windows.zip
          - os: macos-latest
            artifact: Clicker-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches APP_VERSION
        shell: bash
        run: |
          v=$(python -c "from clicker.model import APP_VERSION; print(APP_VERSION)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but APP_VERSION is $v"; exit 1; }
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build
        run: python -m PyInstaller --noconfirm --clean Clicker.spec
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../${{ matrix.artifact }}" Clicker.exe
          else ditto -c -k --keepParent Clicker.app "../${{ matrix.artifact }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Clicker-windows.zip
            Clicker-macos.zip
          generate_release_notes: true
